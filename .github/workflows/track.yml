name: Log 3rd floor count

on:
  schedule:
    # Every 30 minutes (UTC). Off the :00/:30 marks because GitHub delays
    # top-of-hour scheduled runs the most.
    - cron: "7,37 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: log-count
  cancel-in-progress: false

jobs:
  log:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5

      - name: Fetch count and append to data.csv
        run: python3 track.py

      - name: Commit new row
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data.csv
          git add -A latest.html 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "Nothing to commit"
            exit 0
          fi
          git commit -m "data: $(TZ=America/Los_Angeles date +'%Y-%m-%d %H:%M %Z')"
          git pull --rebase
          git push
